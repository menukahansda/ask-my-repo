name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

        # no need for venv, ci works on separate vm, so no venv separation needed

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      
      - name: Lint with ruff
        working-directory: backend
        run: ruff check .
        
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v